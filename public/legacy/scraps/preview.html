<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;background:#0b0805;}
 #wrap{transform-origin:top left;}
 deck-stage{display:block;}
 deck-stage>section{position:relative !important; display:block !important; width:1920px !important; height:1080px !important; margin:0 0 10px;}
</style>
</head><body>
<div id="wrap"></div>
<script src="image-slot.js"></script>
<script>
(async()=>{
  const html = await (await fetch('../Janjatiya Pride — Design Sample.html')).text();
  const doc = new DOMParser().parseFromString(html,'text/html');
  // copy head links + style
  doc.querySelectorAll('head link[rel=stylesheet], head style').forEach(n=>document.head.appendChild(n.cloneNode(true)));
  const stage = document.createElement('deck-stage');
  doc.querySelectorAll('deck-stage>section').forEach(s=>stage.appendChild(s.cloneNode(true)));
  document.getElementById('wrap').appendChild(stage);
  // mark all active so animations show end state
  stage.querySelectorAll('section').forEach(s=>s.setAttribute('data-deck-active',''));
  const scale = (window.__SCALE__||0.46);
  document.getElementById('wrap').style.transform='scale('+scale+')';
  window.__READY__=true;
})();
</script>
</body></html>
